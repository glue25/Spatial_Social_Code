name: Bug report
description: Report a reproducible code or documentation problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal reproduction
      description: Remove API keys and restricted input data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Python, OS, installed extras, benchmark and offline/live mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized traceback
      render: text
