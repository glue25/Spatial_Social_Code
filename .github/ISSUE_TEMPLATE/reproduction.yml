name: Reproduction question
description: Ask about inputs, protocols, setup or result versions.
title: "[Reproduction] "
body:
  - type: textarea
    id: target
    attributes:
      label: Benchmark and protocol
      description: Which paper table, source snapshot or command are you trying to reproduce?
    validations:
      required: true
  - type: textarea
    id: attempt
    attributes:
      label: Setup and steps attempted
      description: Include source commit, environment and input availability. Do not include secrets or restricted media.
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question or observed difference
    validations:
      required: true
