   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(322.567412 121.122039)">The neural social code favors salmon.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(322.567412 134.076496)"/>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(322.567412 147.030953)">Historical query evidence and Bayesian</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(322.567412 159.98541)">fusion change the final answer toward</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(322.567412 172.939867)">apple.</text>
   </g>
