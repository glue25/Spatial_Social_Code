   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 121.122039)">Generated social code records an</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 134.076496)">inside-cabinet belief.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 147.030953)"/>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 159.98541)">The fused historical answer</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 172.939867)">nevertheless selects the opposite</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #27354b" transform="translate(320.652 185.894325)">option.</text>
   </g>
