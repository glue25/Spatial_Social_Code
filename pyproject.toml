[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-social-code"
version = "0.1.0"
description = "Spatial-Social Code for social reasoning in videos"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Xiaoyuan Zhang"},
  {name = "Zhaowei Zhang"},
  {name = "Wenbo Li"},
  {name = "Alan Yuille"},
  {name = "Tianmin Shu"},
  {name = "Jieneng Chen"},
]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "urllib3>=2.0",
]

[project.optional-dependencies]
docs = ["reportlab>=4"]
video = [
  "av>=12.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "tqdm>=4.66",
]
analysis = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "rank-bm25>=0.2.2",
]
local-model = [
  "torch>=2.1",
  "transformers>=4.57",
]
test = [
  "pytest>=7",
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "rank-bm25>=0.2.2",
  "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/glue25/Spatial_Social_Code"
Issues = "https://github.com/glue25/Spatial_Social_Code/issues"
Documentation = "https://github.com/glue25/Spatial_Social_Code/blob/main/GUIDE.md"

[tool.setuptools.packages.find]
include = ["spatial_social_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "external",
  "external_datasets",
  "tmp",
  "output",
  "outputs",
]
addopts = "-ra"
